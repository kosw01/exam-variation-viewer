<svg width="100%" viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-4-1 성능목표 매트릭스 (스케치)</title>
<desc>가로축은 지진 위험도 수준을 재현주기 순으로, 세로축은 요구 성능수준을 기능수행·즉시복구·인명보호·붕괴방지 순으로 둔 격자. 시설물 중요도에 따라 성능목표선이 이동하며, 중요도가 높을수록 같은 위험도에서 더 높은 성능을 요구하므로 선이 왼쪽 위로 옮겨간다. 목표선의 위치는 기준과 시설물에 따라 달라지며 이 그림은 두 축의 조합 구조를 보이기 위한 것이다.</desc>
<text x="285.0" y="26" font-size="15" fill="#33312E" text-anchor="start" font-weight="700">성능목표 설정의 예 </text><text x="363.4" y="26" font-family="Noto Sans CJK KR, sans-serif" font-size="10.5" fill="#33312E" text-anchor="start" font-weight="400">—</text><text x="372.8" y="26" font-size="15" fill="#33312E" text-anchor="start" font-weight="700"> 내진 PBD</text>
<text x="293.2" y="46" font-size="12" fill="#777" text-anchor="start" font-weight="700">요구 성능수준과 지진위험도의 조합</text>
