<text x="417.0" y="158" font-size="11" fill="#888" text-anchor="start" font-weight="700">중요도가 높을수록</text>
<text x="216.4" y="342" font-size="12.5" fill="#33312E" text-anchor="start" font-weight="700">두 축의 조합으로 목표를 정하고, 해석 결과가 그 목표를 만족하는지 검증한다</text>
<text x="258.0" y="362" font-size="11.5" fill="#777" text-anchor="start" font-weight="700">정량 지표 예 : 부재 회전각, 변형률, 잔류변위, 손상수준</text>
<text x="238.7" y="386" font-size="11.5" fill="#999" text-anchor="start" font-weight="700">※ 내진 PBD의 예다. 작용의 종류에 따라 수준 설정 방식이 달라진다</text>
<text x="233.5" y="404" font-size="11" fill="#999" text-anchor="start" font-weight="700">이 도해는 두 축의 조합 구조를 보이기 위한 것이며 특정 기준의 수치가 아니다</text>
