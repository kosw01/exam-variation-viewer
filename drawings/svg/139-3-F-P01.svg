<text x="108" y="586" font-size="13" fill="#000" text-anchor="start" font-weight="bold" font-style="normal">〈단면 제원〉</text>
<text x="108" y="610" font-size="13" fill="#000" text-anchor="start" font-weight="normal" font-style="normal">합성 전:  A = 800,000 mm<tspan font-size="8" dy="-5">2</tspan><tspan font-size="12" dy="5"> </tspan>   ·   I = 360×10<tspan font-size="8" dy="-5">9</tspan><tspan font-size="12" dy="5"> </tspan> mm<tspan font-size="8" dy="-5">4</tspan><tspan font-size="12" dy="5"> </tspan>   ·   y<tspan font-size="8" dy="4">b</tspan><tspan font-size="12" dy="-4"> </tspan> = 900 mm</text>
<text x="108" y="634" font-size="13" fill="#000" text-anchor="start" font-weight="normal" font-style="normal">합성 후:  S<tspan font-size="8" dy="4">cb</tspan><tspan font-size="12" dy="-4"> </tspan> = 500×10<tspan font-size="8" dy="-5">6</tspan><tspan font-size="12" dy="5"> </tspan> mm<tspan font-size="8" dy="-5">3</tspan><tspan font-size="12" dy="5"> </tspan> (하연 단면계수)</text>
<text x="108" y="656" font-size="12" fill="#444" text-anchor="start" font-weight="normal" font-style="normal">긴장재 도심: 하연에서 150 mm  →  e = 750 mm (전 구간 일정)</text>
