<text x="778" y="586" font-size="13" fill="#000" text-anchor="start" font-weight="bold" font-style="normal">〈하중 단계와 저항 단면〉</text>
<text x="778" y="610" font-size="13" fill="#000" text-anchor="start" font-weight="normal" font-style="normal">① w<tspan font-size="8" dy="4">1</tspan><tspan font-size="12" dy="-4"> </tspan> = 25 kN/m  (자중+바닥판)  →  합성 전 단면이 부담</text>
<text x="778" y="634" font-size="13" fill="#000" text-anchor="start" font-weight="normal" font-style="normal">② w<tspan font-size="8" dy="4">2</tspan><tspan font-size="12" dy="-4"> </tspan> = 8 kN/m  (합성 후 고정하중)  →  합성 후 단면이 부담</text>
<text x="778" y="656" font-size="13" fill="#000" text-anchor="start" font-weight="normal" font-style="normal">③ M<tspan font-size="8" dy="4">L</tspan><tspan font-size="12" dy="-4"> </tspan> = 2,400 kN·m  (활하중, 충격 포함)  →  합성 후 단면이 부담</text>
