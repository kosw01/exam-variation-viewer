<title>140-4-5 A단 고정 B단 일방향 힌지 기둥 (문제 도면 재작도)</title>
<desc>같은 기둥을 두 평면에서 본 그림과 단면도. 왼쪽은 x-z 평면으로 기둥 폭이 a이고 B단에 힌지가 있다. 오른쪽은 y-z 평면으로 폭이 b이고 B단의 회전이 구속되어 있다. 아래 단면은 x방향 폭 a, y방향 높이 b인 직사각형이다. 두 그림 모두 A단은 고정이고 기둥 길이는 L, 축하중 P가 B단에 작용한다.</desc>
