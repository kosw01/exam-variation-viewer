<svg width="100%" viewBox="0 0 700 470" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-4-6 선형과 비선형의 응력분포 비교 (스케치)</title>
<desc>왼쪽은 변형률 분포로, 평면 유지 가정에 따라 중립축에서 직선으로 변한다. 선형과 비선형이 같다. 오른쪽은 응력 분포로, 선형 재료는 직선이지만 지수가 0.4인 비선형 재료는 위로 볼록한 형상이 된다. 같은 모멘트에서 응력이 단면에 더 고르게 퍼지므로 최대응력이 선형의 1.5배 계수에서 1.2배 계수로 줄어든다.</desc>
<text x="286.5" y="28" font-size="15" fill="#33312E" text-anchor="start" font-weight="700">평면유지로 변형률은 선형분포,</text>
<text x="258.3" y="48" font-size="15" fill="#33312E" text-anchor="start" font-weight="700">재료법칙에 따라 응력분포 형상이 달라진다</text>
<text x="129.6" y="82" font-family="Noto Sans CJK KR, sans-serif" font-size="9.4" fill="#8A5A22" text-anchor="start" font-weight="400">①</text><text x="139.0" y="82" font-size="13.5" fill="#8A5A22" text-anchor="start" font-weight="700">  변형률 분포</text>
