<svg width="100%" viewBox="0 0 700 452" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-1-13 순수전단과 45도 방향 응력 (스케치)</title>
<desc>왼쪽은 순수전단 상태의 요소로 전단응력만 작용하며 요소가 마름모꼴로 변형한다. 오른쪽은 같은 응력상태를 45도 돌려 본 것으로, 한 대각선 방향으로 전단응력과 같은 크기의 인장이, 직교 방향으로 같은 크기의 압축이 작용하는 2축 응력상태가 된다. 두 관점이 같은 변형을 서술하므로 전단변형률의 절반이 대각선 방향 수직변형률과 같아진다.</desc>
<text x="270.7" y="28" font-size="15" fill="#33312E" text-anchor="start" font-weight="700">같은 응력상태를 두 좌표계에서 본다</text>
