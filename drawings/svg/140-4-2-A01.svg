<svg width="100%" viewBox="0 0 700 424" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-4-2 지하차도 신축이음의 배치와 이음부 구성 (스케치)</title>
<desc>왼쪽은 지하차도 종단에서 신축이음이 놓이는 자리를 보인다. U형 옹벽구간과 박스 구간의 경계, 박스 구간 안의 시공 단위 경계, 지반 조건이 바뀌는 지점이다. 오른쪽은 이음부 단면 구성으로, 외측 지수재와 신축 채움재, 내측 실링재가 층을 이루고 상부 포장의 이음이 구조체 이음과 같은 위치에 놓인다.</desc>
<text x="129.0" y="30" font-family="Noto Sans CJK KR, sans-serif" font-size="10.5" fill="#8B2E2E" text-anchor="start" font-weight="400">①</text><text x="139.5" y="30" font-size="15" fill="#8B2E2E" text-anchor="start" font-weight="700">  이음이 놓이는 자리</text>
<text x="158.4" y="50" font-size="11.5" fill="#888" text-anchor="start" font-weight="700">종단 개념도</text>
