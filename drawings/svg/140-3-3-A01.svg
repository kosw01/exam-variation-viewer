<svg width="100%" viewBox="0 0 700 392" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-3-3 부착식·비부착식 텐던의 방벽 구성 비교 (스케치)</title>
<desc>왼쪽은 부착식 텐던의 단면으로 콘크리트, 덕트, 그라우트, 강연선의 순서로 방벽이 구성되며 공극이나 자유수가 취약부가 된다. 오른쪽은 비부착식 텐던으로 콘크리트, 피복 또는 덕트, 그리스나 왁스 같은 방청재, 강연선의 순서이며 시스템 형식에 따라 구성이 달라진다.</desc>
<text x="287.5" y="28" font-size="15" fill="#33312E" text-anchor="start" font-weight="700">텐던을 둘러싼 방벽의 층 구성</text>
