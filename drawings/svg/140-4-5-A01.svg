<svg width="100%" viewBox="0 0 700 512" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-4-5 두 평면의 좌굴형상과 최적 단면비 (스케치)</title>
<desc>왼쪽은 x-z 평면의 좌굴형상으로 A단 고정 B단 힌지이므로 유효좌굴길이계수가 0.7이고 변곡점이 하나 생긴다. 오른쪽은 y-z 평면으로 A단 고정 B단 회전구속이므로 계수가 0.5이고 변곡점이 둘 생긴다. 약한 쪽이 지배하므로 두 방향의 좌굴하중을 같게 만들 때 좌굴강도가 최대가 되며, 그 조건에서 단면비 a 대 b는 1.4가 된다.</desc>
