<svg width="100%" viewBox="0 0 700 410" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-4-4 절점 처짐과 부재 신장의 관계 (스케치)</title>
<desc>절점 O가 연직으로 델타만큼 내려갈 때 연직재의 신장은 델타와 같고, 경사재의 신장은 델타에 코사인 세타를 곱한 값이다. 변위를 부재축 방향으로 투영하기 때문이다. 경사재는 길이도 L을 코사인 세타로 나눈 값이므로, 두 효과가 함께 작용해 경사재의 부재력에는 코사인이 두 번 곱해진다.</desc>
<text x="209.9" y="30" font-size="15" fill="#33312E" text-anchor="start" font-weight="700">적합조건 : 절점이 아래로 내려갈 때 각 부재는 얼마나 늘어나는가</text>
