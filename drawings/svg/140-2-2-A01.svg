<svg width="100%" viewBox="0 0 700 410" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-2-2 곡선 박스거더의 비틀림 발생과 성분 구분 (스케치)</title>
<desc>왼쪽 평면도는 곡률 반지름 R인 곡선 거더에서 평면곡률에 의해 휨모멘트와 비틀림모멘트가 연성되어 대칭 자중하에서도 비틀림이 발생할 수 있고, 내·외측 연직변위 차와 받침반력 불균등이 생기며 조건에 따라 부반력이 나타날 수 있음을 보인다. 오른쪽 단면도는 폐합 박스단면의 St. Venant 비틀림 전단흐름과, 이와 구별되는 단면 Distortion 변형을 나란히 보이며 Distortion은 격벽·다이어프램으로 억제함을 나타낸다.</desc>
