<svg width="100%" viewBox="0 0 700 356" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-3-4 삼연모멘트법의 면적과 도심 기준단 (스케치)</title>
<desc>왼쪽은 등분포하중을 받는 AB경간의 단순보 모멘트도로, 포물선이 좌우대칭이어서 도심이 중앙에 놓이고 어느 단에서 재도 3.0 m로 같다. 오른쪽은 삼각형 분포하중을 받는 BC경간의 단순보 모멘트도로, 비대칭이어서 도심이 B에서 3.2 m, C에서 2.8 m로 다르다. 삼연모멘트식에서 오른쪽 경간은 오른쪽 지점 C를 기준으로 재야 한다.</desc>
