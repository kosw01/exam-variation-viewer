<title>140-1-8 전단중심 (스케치)</title>
<desc>채널 단면에서 하중이 도심을 지날 때는 플랜지 전단흐름의 합력이 만드는 우력이 남아 비틀림이 생기고, 하중이 전단중심을 지날 때는 그 우력이 상쇄되어 휨만 생긴다. 전단중심은 복부 바깥쪽에 놓이며 도심과 일치하지 않는다.</desc>
<text x="242.7" y="28" font-size="15" fill="#33312E" text-anchor="start" font-weight="700">전단중심 = 횡하중이 지나면 비틀림이 생기지 않는 점</text>
