<svg width="100%" viewBox="0 0 700 392" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-3-2 구조해석 절차에서 머신러닝이 놓이는 자리 (스케치)</title>
<desc>입력, 물리 기반 해석, 출력으로 이어지는 구조해석 절차 위에 머신러닝이 끼어드는 다섯 지점을 표시한 그림. 입력 앞의 하중·물성 추정, 반복 해석을 가속하는 대리모델, 출력 뒤의 결과 판정과 손상 탐지, 계측값에서 모델 매개변수를 역추정하는 경로, 그리고 설계변수를 갱신하는 최적화 폐루프다. 검증 기준은 물리법칙과 검증된 해석, 실험·실측이다.</desc>
<text x="254.2" y="30" font-size="15" fill="#33312E" text-anchor="start" font-weight="700">구조해석 절차에서 머신러닝이 놓이는 다섯 자리</text>
