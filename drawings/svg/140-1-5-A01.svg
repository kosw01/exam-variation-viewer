<svg width="100%" viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-1-5 볼트접합부의 파괴형식 (스케치)</title>
<desc>볼트접합부의 네 가지 파괴형식. 볼트 전단파괴는 볼트 축에 직각인 면에서 볼트가 끊어지는 것, 판의 지압파괴는 볼트가 판을 눌러 구멍이 늘어나는 것, 순단면 인장파괴는 구멍으로 줄어든 단면에서 판이 끊어지는 것, 블록전단파괴는 인장면과 전단면이 함께 떨어져 덩어리가 빠지는 것이다.</desc>
<text x="267.2" y="28" font-size="15" fill="#33312E" text-anchor="start" font-weight="700">무엇이 먼저 항복하는가로 형식이 갈린다</text>
