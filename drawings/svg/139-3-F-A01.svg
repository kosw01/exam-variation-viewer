<text x="168" y="602" font-size="13" fill="#000" text-anchor="start" font-weight="bold" font-style="normal">성립조건을 정리하면  13.631 / η ≤ 18   →   본 문제의 “전 구간 동일 편심 e” 가정하에서는 e 가 소거된다.</text>
<text x="168" y="626" font-size="12" fill="#444" text-anchor="start" font-weight="normal" font-style="normal">따라서 전 구간 공통 편심 조정만으로는 범위 불성립을 해소할 수 없다. 단부 디본딩 등 도입 시 상한조건 자체를 변경하는 것은 이와 구분되는 별도의 설계 대안이다.</text>
