<svg width="100%" viewBox="0 0 700 392" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-1-1 저항과 하중효과의 분포와 부분안전계수 (스케치)</title>
<desc>하중효과와 저항을 각각 확률분포로 두면 두 분포가 겹치는 범위에서 저항이 하중효과보다 작아질 수 있고, 그 확률이 파괴확률이다. 신뢰성지수는 이 확률을 표준정규 좌표로 옮긴 값이다. 아래는 한계상태설계법이 하중계수와 강도감소계수로 같은 안전수준을 간접 확보하는 구조를 나타낸다.</desc>
<text x="259.6" y="28" font-size="15" fill="#33312E" text-anchor="start" font-weight="700">저항 R 과 하중효과 S 를 확률변수로 본다</text>
