<svg width="100%" viewBox="0 0 700 372" xmlns="http://www.w3.org/2000/svg" font-family="Nanum DdarEGeEomMaGa, Noto Sans CJK KR, sans-serif">
<title>140-3-6 중앙 게르버 힌지 설치 전후 휨모멘트도 비교 (스케치)</title>
<desc>회색 곡선은 중앙 힌지가 없는 양단고정보의 휨모멘트도, 진한 곡선은 중앙에 게르버 힌지를 설치한 경우의 휨모멘트도다. 힌지점 C에서 휨모멘트가 0이 되고 중앙부 정모멘트가 줄어든 대신, 양 고정단 A와 B의 부모멘트가 각각 같은 양만큼 커진다. 증가량은 본 하중조건에서 WL제곱/48 더하기 PL/32 이다.</desc>
<text x="259.4" y="32" font-size="15" fill="#33312E" text-anchor="start" font-weight="700">중앙 게르버 힌지 설치 전 </text><text x="369.0" y="32" font-family="Noto Sans CJK KR, sans-serif" font-size="10.5" fill="#33312E" text-anchor="start" font-weight="400">·</text><text x="374.9" y="32" font-size="15" fill="#33312E" text-anchor="start" font-weight="700"> 후의 휨모멘트도</text>
<text x="283.1" y="52" font-size="11.5" fill="#888" text-anchor="start" font-weight="700">기선 위 = 정모멘트,  기선 아래 = 부모멘트</text>
